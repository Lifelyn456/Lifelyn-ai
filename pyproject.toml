[project]
name = "lifelyn-ai"
version = "0.1.0"
description = "Private evidence-bound record processing for Lifelyn"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi[standard]==0.141.1",
    "httpx>=0.28,<1",
    "pgvector>=0.4,<1",
    "pydantic>=2.12,<3",
    "pypdf>=6.8,<7",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "structlog>=25,<26",
    "tenacity>=9,<10",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15", "mypy>=1.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifelyn_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
